name: Kakao Golf Notifier

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v3

      - name: 파이썬 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 프로그램 패키지 설치
        run: pip install requests beautifulsoup4

      - name: 취소표 확인 및 카톡 알림 실행
        env:
          KAKAO_TOKEN: ${{ secrets.KAKAO_TOKEN }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
        run: python main.py
